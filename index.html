<body>
  <audio id="startup-sound" src="assets/sounds/startup.wav" preload="auto" hidden></audio>

  <main id="desktop" aria-label="Windows XP asztal">
    <div id="desktop-icons"></div>
    <div id="windows"></div>
    <div id="selection-box" hidden></div>
  </main>
  <footer id="taskbar">
    <button id="start-button" aria-label="" data-i18n-aria-label="text_start_menu" aria-expanded="false"><img src="assets/icons/windows-logo.png" alt=""><span>start</span></button><span id="taskbar-move-grip" aria-hidden="true"></span>
    <div class="quick-launch"><button id="show-desktop" title="" data-i18n-title="text_show_desktop"><img src="assets/icons/showdesktop.png" alt="" data-i18n-alt="text_show_desktop"></button><button data-open="ie" title="Internet Explorer"><img src="assets/icons/ie.png" alt="Internet Explorer"></button><button data-open="player" title="Windows Media Player"><img src="assets/icons/player.png" alt="Windows Media Player"></button></div>
    <div id="task-buttons"></div>
    <div class="tray"><button id="tray-toggle" class="tray-toggle" title="" data-i18n-title="text_show_hidden_icons" aria-label="" data-i18n-aria-label="text_show_hidden_icons" aria-expanded="false" aria-controls="tray-hidden"></button><div id="tray-hidden" class="tray-hidden" hidden><button data-tray="outlook" title="Outlook Express"><img src="assets/icons/mail.png" alt="Outlook Express"></button></div><button data-tray="security" title="" data-i18n-title="text_security_center"><img src="assets/icons/security.png" alt="" data-i18n-alt="text_security_center"></button><button id="volume-button" title="" data-i18n-title="text_volume"><img src="assets/icons/volume.png" alt="" data-i18n-alt="text_volume"></button><button data-open="network" title="" data-i18n-title="text_local_area_connection"><img src="assets/icons/network.png" alt="" data-i18n-alt="text_network"></button><button id="clock" title="" data-i18n-title="text_date_and_time"></button></div><span id="taskbar-resize-grip" aria-hidden="true"></span>
  </footer>
  <section id="start-menu" aria-label="" data-i18n-aria-label="text_start_menu" hidden></section>
  <div id="context-menu" class="popup-menu" role="menu" hidden></div>
  <div id="volume-flyout" hidden>
    <span class="volume-caption" data-i18n="text_volume"></span>
    <input type="range" class="volume-dial" min="0" max="100" step="1" aria-label="" data-i18n-aria-label="text_volume" orient="vertical">
    <label class="volume-mute"><input type="checkbox"> <span data-i18n="text_mute"></span></label>
  </div>
  <aside id="balloon" hidden></aside>
  <section id="boot-screen" class="full-screen">
    <div class="boot-center"><div class="windows-brand"><img src="assets/icons/windows-logo.png" alt=""><small>Microsoft®</small><strong>Windows<i>®</i><span>xp<em>™</em></span></strong><p>Professional</p></div><div class="boot-loader"><span></span><span></span><span></span></div><p class="boot-caption" data-i18n="text_loading_windows"></p></div>
    <div class="boot-bottom"><span>Copyright © Microsoft Corporation</span><em>Microsoft</em></div><button id="skip-boot" data-i18n="text_click_to_start"></button>
  </section>
  <section id="welcome-screen" class="full-screen" hidden><div class="welcome-top"></div><div class="welcome-center"><span data-i18n="text_welcome"></span></div><div class="welcome-bottom"></div></section>
  <section id="off-screen" class="full-screen" hidden><div class="windows-brand"><img src="assets/icons/windows-logo.png" alt=""><small>Microsoft®</small><strong>Windows<i>®</i><span>xp<em>™</em></span></strong><p>Professional</p></div><p data-i18n="text_it_is_now_safe_to_turn_off_your_computer"></p><button class="xp-button" id="power-on" data-i18n="text_turn_on"></button></section>
